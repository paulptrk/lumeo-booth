services:
  app:
    build: .
    # if the db isn't ready yet (migrations fail) or the process dies, start again
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # inside the compose network the db is "db:5432", not localhost:5433.
      # these are the local dev credentials defined for the db below
      DATABASE_URL: postgres://lumeo:lumeo@db:5432/lumeo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumeo
      POSTGRES_PASSWORD: lumeo
      POSTGRES_DB: lumeo
    ports:
      # 5433 on the host so it doesn't clash with a local postgres install
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumeo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
