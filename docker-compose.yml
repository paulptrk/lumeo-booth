services:
  app:
    build: .
    # if the db isn't ready yet (migrations fail) or the process dies, start again
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # inside the compose network the db is "db:5432", not localhost:5433.
      # built from the same POSTGRES_* values as the db service, read from .env
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      # no default on purpose: a known secret would let anyone forge login tokens
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health also checks the db, so a db outage marks the app unhealthy too
      # (a readiness check, not liveness). docker doesn't restart on unhealthy
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16
    environment:
      # values come from .env (copy .env.example). there are no defaults on
      # purpose, so a missing value stops compose instead of using a known password
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 5433 on the host so it doesn't clash with a local postgres install
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ so the container expands these, not compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
