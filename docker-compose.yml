services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumeo
      POSTGRES_PASSWORD: lumeo
      POSTGRES_DB: lumeo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumeo"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
